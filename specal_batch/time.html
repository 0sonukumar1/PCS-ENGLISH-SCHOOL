<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock &amp; Greeting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 40px;
        }

        .greeting {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1e293b;
        }

        .time {
            min-width: 320px;
            padding: 10px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 2.25rem;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.08em;
            font-style: normal;
            border: 1px solid red;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="greeting"></div>
    <div class="time"></div>

    <script>
        const greetingEl = document.querySelector(".greeting");
        const timeEl = document.querySelector(".time");

        function getGreeting(hour24) {
            if (hour24 >= 5 && hour24 < 12) return "Good Morning";
            if (hour24 >= 12 && hour24 < 17) return "Good Afternoon";
            if (hour24 >= 17 && hour24 < 21) return "Good Evening";
            return "Good Night";
        }

        function updateClock() {
            const now = new Date();
            const hour24 = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            const period = hour24 < 12 ? "AM" : "PM";
            const hour12 = String(hour24 % 12 || 12).padStart(2, "0");

            greetingEl.textContent = getGreeting(hour24);
            timeEl.textContent = `${hour12}:${minutes}:${seconds} ${period}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>

</html>
