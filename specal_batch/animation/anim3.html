<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS ENGLISH SCHOOL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
         

        .lit-banner {
            text-transform: uppercase;
            line-height: 1.2;
        }

        .line-one {
            display: block;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #e0f2fe;
            text-shadow:
                0 0 8px rgba(56, 189, 248, 0.9),
                0 0 22px rgba(56, 189, 248, 0.65),
                0 0 42px rgba(168, 85, 247, 0.45);
        }

        .line-two {
            display: block;
            font-size: clamp(1.15rem, 3.2vw, 2rem);
            font-weight: 600;
            letter-spacing: 0.24em;
            margin-top: 0.5rem;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.45));
        }
    </style>


    <style>
         

        .lit-banner {
            text-transform: uppercase;
            line-height: 1.2;
            background-color: black;
        }

        .line-one {
            display: block;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #e0f2fe;
            text-shadow:
                0 0 8px rgba(56, 189, 248, 0.9),
                0 0 22px rgba(56, 189, 248, 0.65),
                0 0 42px rgba(168, 85, 247, 0.45);
        }

        .line-two {
            display: block;
            font-size: clamp(1.15rem, 3.2vw, 2rem);

            background: linear-gradient(90deg, #38bdf8, #a855f7, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.45));
        }
    </style>



</head>

<body>
    <h1 class="lit-banner">
        <span class="line-one">PCS</span>
        <span class="line-two">ENGLISH SCHOOL</span>
    </h1>
</body>

</html>
