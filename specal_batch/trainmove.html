<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train Crossing a Pole — SVG Simulator</title>
    <link rel="stylesheet" href="coman_style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 24px;
        }

        .app {
            max-width: 980px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.55rem;
            margin-bottom: 6px;
        }

        .sub {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-bottom: 18px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .bogie-stepper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bogie-stepper button {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #334155;
            color: #f8fafc;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .bogie-count {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 7px 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-go {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            background: #22c55e;
            color: #052e16;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-go:hover {
            filter: brightness(1.06);
        }

        .btn-reset,
        .btn-mute {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f8fafc;
            font-weight: 600;
            cursor: pointer;
        }

        .readout {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
        }

        .readout strong {
            color: #38bdf8;
        }

        .stage {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="color_eq_container open_colse">
        <div class="app">
            <h1>Train Crossing a Pole</h1>
            <p class="sub">Adjust speed and bogies, then press <strong>Go</strong> to see how long the full train takes
                to
                pass the pole.</p>

            <div class="controls">
                <div class="field">
                    <label for="speedVal">Speed</label>
                    <input type="number" id="speedVal" min="0.5" step="any" value="20" />
                </div>
                <div class="field">
                    <label for="speedUnit">Speed Unit</label>
                    <select id="speedUnit">
                        <option value="mps" selected>m/s (meters/sec)</option>
                        <option value="kmph">km/h (kilometers/hr)</option>
                    </select>
                </div>
                <div class="field">
                    <label>Number of Bogies</label>
                    <div class="bogie-stepper">
                        <button type="button" id="decBogie" aria-label="Decrease bogies">−</button>
                        <div class="bogie-count" id="bogieDisplay">3</div>
                        <button type="button" id="incBogie" aria-label="Increase bogies">+</button>
                    </div>
                </div>
                <div class="field">
                    <label for="bogieLen">Length per Bogie (m)</label>
                    <input type="number" id="bogieLen" min="1" step="any" value="15" />
                </div>
                <div class="field">
                    <label for="engineLen">Engine Length (m)</label>
                    <input type="number" id="engineLen" min="1" step="any" value="20" />
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn-go" id="goBtn">Go</button>
                <button type="button" class="btn-reset" id="resetBtn">Reset</button>
                <button type="button" class="btn-mute" id="muteBtn">Sound: ON</button>
            </div>

            <div class="readout" id="readout">
                <div>Total Train Length: <strong id="totalLenOut">65.0 m</strong></div>
                <div>Bogie People: <strong id="peopleOut">3 (1 / bogie)</strong></div>
                <div>Calculated Crossing Time: <strong id="calcTimeOut">3.25 s</strong></div>
                <div>Live Stopwatch: <strong id="liveTimeOut">0.00 s</strong></div>
            </div>

            <div class="stage">
                <svg id="scene" viewBox="0 0 1000 280" role="img" aria-label="SVG train with bogies crossing a pole">
                    <!-- Sky & Road / Ground -->
                    <rect x="0" y="0" width="1000" height="190" fill="#f1f5f9" />
                    <rect x="0" y="190" width="1000" height="90" fill="#475569" />
                    <!-- Road / Track rail -->
                    <line x1="0" y1="205" x2="1000" y2="205" stroke="#1e293b" stroke-width="4" />
                    <line x1="0" y1="213" x2="1000" y2="213" stroke="#94a3b8" stroke-width="2"
                        stroke-dasharray="14 10" />

                    <!-- Pole at x = 680 -->
                    <g id="pole">
                        <rect x="675" y="65" width="10" height="145" rx="2" fill="#dc2626" stroke="#7f1d1d"
                            stroke-width="1.5" />
                        <rect x="668" y="205" width="24" height="8" rx="2" fill="#1e293b" />
                        <text x="680" y="54" text-anchor="middle" font-size="13" font-weight="700"
                            fill="#0f172a">POLE</text>
                        <line x1="680" y1="60" x2="680" y2="225" stroke="#dc2626" stroke-width="1"
                            stroke-dasharray="4 4" opacity="0.6" />
                    </g>

                    <!-- Moving Train Group -->
                    <g id="trainGroup"></g>

                    <!-- Thrown Bottles & Snack Packets Layer -->
                    <g id="thrownItemsGroup"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const speedInput = document.getElementById("speedVal");
        const speedUnitSelect = document.getElementById("speedUnit");
        const bogieDisplay = document.getElementById("bogieDisplay");
        const bogieLenInput = document.getElementById("bogieLen");
        const engineLenInput = document.getElementById("engineLen");
        const goBtn = document.getElementById("goBtn");
        const resetBtn = document.getElementById("resetBtn");
        const muteBtn = document.getElementById("muteBtn");
        const totalLenOut = document.getElementById("totalLenOut");
        const peopleOut = document.getElementById("peopleOut");
        const calcTimeOut = document.getElementById("calcTimeOut");
        const liveTimeOut = document.getElementById("liveTimeOut");
        const trainGroup = document.getElementById("trainGroup");
        const thrownItemsGroup = document.getElementById("thrownItemsGroup");

        const POLE_X = 680;
        const PRE_POLE_OFFSET = 12;
        const TRACK_Y = 205;
        const PX_PER_METER = 3.2;
        const GAP_PX = 6;
        const METERS_PER_PERSON = 20;
        const THROW_DELAY_SEC = 1.4; // throws start after a couple of seconds into the run

        let bogies = 3;
        let animId = null;
        let running = false;
        let startTimestamp = null;
        let hornPlayedAtPole = false;
        let currentNoseX = POLE_X - PRE_POLE_OFFSET;
        let bogieWindowAnchors = []; // local { x, y } per bogie
        let thrownItems = [];
        let nextThrowTimeSec = THROW_DELAY_SEC;

        // Train sound synthesizer state
        let soundEnabled = true;
        let audioCtx = null;
        let rumbleOsc = null;
        let rumbleFilter = null;
        let rumbleGain = null;
        let chugTimerId = null;
        let noiseBuffer = null;

        function getPeoplePerBogie() {
            const bLen = Math.max(1, Number(bogieLenInput.value) || 15);
            return Math.max(1, Math.floor(bLen / METERS_PER_PERSON));
        }

        function ensureAudioContext() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            if (!noiseBuffer && audioCtx) {
                const length = audioCtx.sampleRate * 0.25;
                noiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }
            return audioCtx;
        }

        function triggerChugPulse(ctx, speedMps, stepIndex) {
            if (!soundEnabled || !ctx || !running) return;
            const now = ctx.currentTime;

            const noise = ctx.createBufferSource();
            noise.buffer = noiseBuffer;

            const bandpass = ctx.createBiquadFilter();
            bandpass.type = "bandpass";
            bandpass.frequency.setValueAtTime(340 + Math.min(400, speedMps * 12) + (stepIndex % 2) * 70, now);
            bandpass.Q.setValueAtTime(1.8, now);

            const env = ctx.createGain();
            const accent = stepIndex % 2 === 0 ? 0.16 : 0.1;
            env.gain.setValueAtTime(0.001, now);
            env.gain.linearRampToValueAtTime(accent, now + 0.012);
            env.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            noise.connect(bandpass);
            bandpass.connect(env);
            env.connect(ctx.destination);

            noise.start(now);
            noise.stop(now + 0.1);
        }

        function playTrainHorn(durationSec = 0.45) {
            if (!soundEnabled) return;
            const ctx = ensureAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;
            const freqs = [293.66, 369.99];
            const hornGain = ctx.createGain();
            hornGain.gain.setValueAtTime(0.001, now);
            hornGain.gain.linearRampToValueAtTime(0.09, now + 0.04);
            hornGain.gain.setValueAtTime(0.09, now + durationSec - 0.08);
            hornGain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);
            hornGain.connect(ctx.destination);

            freqs.forEach((f) => {
                const osc = ctx.createOscillator();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(f, now);

                const lp = ctx.createBiquadFilter();
                lp.type = "lowpass";
                lp.frequency.setValueAtTime(1350, now);

                osc.connect(lp);
                lp.connect(hornGain);
                osc.start(now);
                osc.stop(now + durationSec + 0.02);
            });
        }

        function startTrainSound(speedMps) {
            if (!soundEnabled) return;
            const ctx = ensureAudioContext();
            if (!ctx) return;

            stopTrainSound();

            const clampedSpeed = Math.max(2, Math.min(80, speedMps || 20));
            const baseRumble = 46 + clampedSpeed * 0.9;

            rumbleOsc = ctx.createOscillator();
            rumbleOsc.type = "sawtooth";
            rumbleOsc.frequency.setValueAtTime(baseRumble, ctx.currentTime);

            rumbleFilter = ctx.createBiquadFilter();
            rumbleFilter.type = "lowpass";
            rumbleFilter.frequency.setValueAtTime(150 + clampedSpeed * 4, ctx.currentTime);

            rumbleGain = ctx.createGain();
            rumbleGain.gain.setValueAtTime(0.045, ctx.currentTime);

            rumbleOsc.connect(rumbleFilter);
            rumbleFilter.connect(rumbleGain);
            rumbleGain.connect(ctx.destination);
            rumbleOsc.start();

            const intervalMs = Math.max(95, Math.min(360, 340 - clampedSpeed * 5.5));
            let step = 0;
            triggerChugPulse(ctx, clampedSpeed, step++);
            chugTimerId = setInterval(() => {
                if (!running || !soundEnabled) return;
                triggerChugPulse(ctx, clampedSpeed, step++);
            }, intervalMs);

            playTrainHorn(0.32);
        }

        function stopTrainSound() {
            if (chugTimerId) {
                clearInterval(chugTimerId);
                chugTimerId = null;
            }
            try {
                if (rumbleOsc) {
                    rumbleOsc.stop();
                    rumbleOsc.disconnect();
                }
                if (rumbleFilter) rumbleFilter.disconnect();
                if (rumbleGain) rumbleGain.disconnect();
            } catch (e) {
                // Ignore already-stopped nodes
            }
            rumbleOsc = null;
            rumbleFilter = null;
            rumbleGain = null;
        }

        function getSpeedMps() {
            const raw = Number(speedInput.value);
            if (!raw || raw <= 0 || Number.isNaN(raw)) return 0;
            return speedUnitSelect.value === "kmph" ? raw * (1000 / 3600) : raw;
        }

        function getTotalLengthMeters() {
            const eLen = Math.max(1, Number(engineLenInput.value) || 20);
            const bLen = Math.max(1, Number(bogieLenInput.value) || 15);
            return eLen + bogies * bLen;
        }

        function getCrossingTimeSec() {
            const v = getSpeedMps();
            if (v <= 0) return Infinity;
            return getTotalLengthMeters() / v;
        }

        function getVisualDimensionsPx() {
            const eLen = Math.max(1, Number(engineLenInput.value) || 20);
            const bLen = Math.max(1, Number(bogieLenInput.value) || 15);
            const enginePx = Math.max(44, Math.min(130, eLen * PX_PER_METER));
            const bogiePx = Math.max(34, Math.min(95, bLen * PX_PER_METER));
            const totalVisualPx = enginePx + bogies * (bogiePx + GAP_PX);
            return { enginePx, bogiePx, totalVisualPx };
        }

        function renderWindowHead(cx, cy, index, radius = 3.2) {
            const eyeOffset = Math.max(0.55, radius * 0.32);
            const eyeR = Math.max(0.5, radius * 0.18);
            return `
                <g class="window-head" data-head-index="${index}">
                    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="#fde68a" stroke="#92400e" stroke-width="0.85" />
                    <circle cx="${cx - eyeOffset}" cy="${cy - radius * 0.14}" r="${eyeR}" fill="#1e293b" />
                    <circle cx="${cx + eyeOffset}" cy="${cy - radius * 0.14}" r="${eyeR}" fill="#1e293b" />
                </g>
            `;
        }

        function renderBogieHeads(winX, winY, winW, winH, count, startIndex) {
            const cy = winY + winH - 2.2;
            if (count <= 1) {
                return {
                    html: renderWindowHead(winX + winW / 2, cy, startIndex, 3.2),
                    nextIndex: startIndex + 1
                };
            }

            const maxDrawn = Math.min(count, Math.max(2, Math.floor((winW - 4) / 5.5)));
            const radius = maxDrawn >= 6 ? 2.2 : maxDrawn >= 4 ? 2.6 : 3.0;
            const usableW = Math.max(4, winW - radius * 2.4);
            let html = "";
            let idx = startIndex;

            for (let k = 0; k < maxDrawn; k++) {
                const t = maxDrawn === 1 ? 0.5 : k / (maxDrawn - 1);
                const cx = winX + radius * 1.2 + t * usableW;
                html += renderWindowHead(cx, cy, idx++, radius);
            }

            return { html, nextIndex: idx };
        }

        function renderWheel(cx, cy, r) {
            const spoke = r * 0.72;
            return `
                <g class="train-wheel" data-cx="${cx}" data-cy="${cy}">
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
                    <line x1="${cx - spoke}" y1="${cy}" x2="${cx + spoke}" y2="${cy}" stroke="#f8fafc" stroke-width="1.2" />
                    <line x1="${cx}" y1="${cy - spoke}" x2="${cx}" y2="${cy + spoke}" stroke="#f8fafc" stroke-width="1.2" />
                    <circle cx="${cx}" cy="${cy}" r="1.6" fill="#38bdf8" />
                </g>
            `;
        }

        function renderStopSignal(x, y) {
            return `
                <g class="last-stop-signal">
                    <circle class="stop-glow" cx="${x}" cy="${y}" r="7" fill="#ef4444" opacity="0.35" />
                    <circle class="stop-lamp" cx="${x}" cy="${y}" r="3.6" fill="#ff2a2a" stroke="#7f1d1d" stroke-width="0.9" />
                </g>
            `;
        }

        function updateStopSignalState(elapsedSec, isMoving, isStoppedAtEnd) {
            const signal = trainGroup.querySelector(".last-stop-signal");
            if (!signal) return;
            const glow = signal.querySelector(".stop-glow");
            const lamp = signal.querySelector(".stop-lamp");

            if (isStoppedAtEnd) {
                glow.setAttribute("opacity", "0.75");
                glow.setAttribute("r", "8.5");
                lamp.setAttribute("fill", "#ff1e1e");
            } else if (isMoving) {
                const pulse = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(elapsedSec * 10));
                glow.setAttribute("opacity", pulse.toFixed(2));
                glow.setAttribute("r", "7");
                lamp.setAttribute("fill", "#ef4444");
            } else {
                glow.setAttribute("opacity", "0.25");
                glow.setAttribute("r", "6.5");
                lamp.setAttribute("fill", "#dc2626");
            }
        }

        function renderTrainSvg() {
            const { enginePx, bogiePx } = getVisualDimensionsPx();
            const perBogiePeople = getPeoplePerBogie();
            let parts = [];
            let headIndex = 0;
            bogieWindowAnchors = [];

            const engX = -enginePx;
            const engY = TRACK_Y - 46;
            const engWinX = engX + 8;
            const engWinY = engY + 6;
            const engWinW = Math.max(12, enginePx * 0.35);
            const engWinH = 12;
            const engineStopSignalHtml = bogies === 0 ? renderStopSignal(engX + 2.5, engY + 18) : "";

            parts.push(`
                <rect x="${engX}" y="${engY}" width="${enginePx}" height="36" rx="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="2" />
                ${engineStopSignalHtml}
                <rect x="${engWinX}" y="${engWinY}" width="${engWinW}" height="${engWinH}" rx="2" fill="#bae6fd" />
                ${renderWindowHead(engWinX + engWinW / 2, engWinY + engWinH - 2, headIndex++, 3.2)}
                <circle cx="${engX + enginePx - 4}" cy="${engY + 24}" r="4" fill="#facc15" />
                <text x="${engX + enginePx / 2}" y="${engY + 25}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">ENGINE</text>
                ${renderWheel(engX + 12, TRACK_Y - 4, 6)}
                ${renderWheel(engX + enginePx - 12, TRACK_Y - 4, 6)}
            `);

            let cursorRight = engX - GAP_PX;
            for (let i = 1; i <= bogies; i++) {
                const bx = cursorRight - bogiePx;
                const by = TRACK_Y - 42;
                const winX = bx + 5;
                const winY = by + 5;
                const winW = Math.max(10, bogiePx - 10);
                const winH = 9;
                const isLastBogie = i === bogies;
                const stopSignalHtml = isLastBogie ? renderStopSignal(bx + 2.5, by + 16) : "";
                const headsResult = renderBogieHeads(winX, winY, winW, winH, perBogiePeople, headIndex);
                headIndex = headsResult.nextIndex;

                bogieWindowAnchors.push({
                    x: winX + winW / 2,
                    y: winY + winH / 2
                });

                parts.push(`<line x1="${cursorRight}" y1="${TRACK_Y - 22}" x2="${cursorRight + GAP_PX}" y2="${TRACK_Y - 22}" stroke="#1e293b" stroke-width="3" />`);
                parts.push(`
                    <rect x="${bx}" y="${by}" width="${bogiePx}" height="32" rx="5" fill="#0284c7" stroke="#0c4a6e" stroke-width="2" />
                    ${stopSignalHtml}
                    <rect x="${winX}" y="${winY}" width="${winW}" height="${winH}" rx="2" fill="#e0f2fe" />
                    ${headsResult.html}
                    <text x="${bx + bogiePx / 2}" y="${by + 25}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">B${i} (${perBogiePeople})</text>
                    ${renderWheel(bx + 10, TRACK_Y - 4, 5.5)}
                    ${renderWheel(bx + bogiePx - 10, TRACK_Y - 4, 5.5)}
                `);
                cursorRight = bx - GAP_PX;
            }

            trainGroup.innerHTML = parts.join("");
            animateWindowHeads(0, false);
            rotateWheels(0);
            updateStopSignalState(0, false, false);
        }

        function spawnThrownItems(dtReal) {
            if (!running || bogieWindowAnchors.length === 0) return;
            if (dtReal < nextThrowTimeSec) return;

            // Schedule next throw ~0.55s later
            nextThrowTimeSec = dtReal + 0.55;

            const anchor = bogieWindowAnchors[Math.floor(Math.random() * bogieWindowAnchors.length)];
            const startX = currentNoseX + anchor.x;
            const startY = anchor.y;
            const kind = Math.random() < 0.55 ? "bottle" : "snack";
            const vx = 45 + Math.random() * 55;
            const vy = -55 - Math.random() * 35;

            thrownItems.push({
                kind,
                x: startX,
                y: startY,
                vx,
                vy,
                angle: (Math.random() - 0.5) * 30,
                spin: (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 180),
                age: 0,
                landed: false
            });
        }

        function updateAndRenderThrownItems(dtStep) {
            const groundY = TRACK_Y + 12;
            const gravity = 320;
            const active = [];

            for (const item of thrownItems) {
                item.age += dtStep;
                if (!item.landed) {
                    item.x += item.vx * dtStep;
                    item.vy += gravity * dtStep;
                    item.y += item.vy * dtStep;
                    item.angle += item.spin * dtStep;

                    if (item.y >= groundY) {
                        item.y = groundY;
                        item.landed = true;
                        item.vx = 0;
                        item.vy = 0;
                    }
                }
                if (item.age < 3.2 && item.x < 1040) {
                    active.push(item);
                }
            }

            thrownItems = active;

            const svgHtml = thrownItems
                .map((item) => {
                    const fade = item.landed ? Math.max(0, 1 - (item.age - 1.5) / 1.7) : 1;
                    if (item.kind === "bottle") {
                        return `
                            <g transform="translate(${item.x.toFixed(1)}, ${item.y.toFixed(1)}) rotate(${item.angle.toFixed(1)})" opacity="${fade.toFixed(2)}">
                                <rect x="-2.2" y="-6.5" width="4.4" height="9.5" rx="1.2" fill="#38bdf8" stroke="#0369a1" stroke-width="0.8" />
                                <rect x="-1.2" y="-8.5" width="2.4" height="2.2" rx="0.5" fill="#e0f2fe" stroke="#0369a1" stroke-width="0.7" />
                                <line x1="-1.8" y1="-2" x2="1.8" y2="-2" stroke="#ffffff" stroke-width="0.8" />
                            </g>
                        `;
                    }
                    return `
                        <g transform="translate(${item.x.toFixed(1)}, ${item.y.toFixed(1)}) rotate(${item.angle.toFixed(1)})" opacity="${fade.toFixed(2)}">
                            <rect x="-4.5" y="-3.2" width="9" height="6.4" rx="1.4" fill="#f59e0b" stroke="#92400e" stroke-width="0.8" />
                            <line x1="-2.5" y1="-3.2" x2="-2.5" y2="3.2" stroke="#fef3c7" stroke-width="0.7" />
                            <line x1="2.5" y1="-3.2" x2="2.5" y2="3.2" stroke="#fef3c7" stroke-width="0.7" />
                        </g>
                    `;
                })
                .join("");

            thrownItemsGroup.innerHTML = svgHtml;
        }

        function animateWindowHeads(elapsedSec, isMoving) {
            const heads = trainGroup.querySelectorAll(".window-head");
            heads.forEach((head, idx) => {
                if (!isMoving) {
                    head.setAttribute("transform", "translate(0, 0)");
                    return;
                }
                const phase = elapsedSec * 9 + idx * 1.1;
                const dx = Math.sin(phase) * 1.4;
                const dy = Math.abs(Math.cos(phase * 1.5)) * -1.2;
                head.setAttribute("transform", `translate(${dx.toFixed(2)}, ${dy.toFixed(2)})`);
            });
        }

        function rotateWheels(angleDeg) {
            const wheels = trainGroup.querySelectorAll(".train-wheel");
            wheels.forEach((wheel) => {
                const cx = Number(wheel.getAttribute("data-cx"));
                const cy = Number(wheel.getAttribute("data-cy"));
                wheel.setAttribute("transform", `rotate(${angleDeg.toFixed(1)} ${cx} ${cy})`);
            });
        }

        function positionTrainByProgress(progress) {
            const clamped = Math.max(0, Math.min(1, progress));
            const { enginePx, totalVisualPx } = getVisualDimensionsPx();
            const startNoseX = POLE_X 
            const endNoseX = POLE_X + totalVisualPx;
            const noseX = startNoseX + clamped * (endNoseX - startNoseX);
            currentNoseX = noseX;
            trainGroup.setAttribute("transform", `translate(${noseX}, 0)`);

            const engineFrontX = noseX - enginePx;
            if (!hornPlayedAtPole && engineFrontX >= POLE_X) {
                hornPlayedAtPole = true;
                playTrainHorn(0.35);
            }

            const traveledPx = clamped * (endNoseX - startNoseX);
            const wheelRadiusPx = 6;
            const angleDeg = (traveledPx / wheelRadiusPx) * (180 / Math.PI);
            rotateWheels(angleDeg);
        }

        function updateReadouts() {
            bogieDisplay.textContent = bogies;
            const totalM = getTotalLengthMeters();
            const tSec = getCrossingTimeSec();
            const perBogie = getPeoplePerBogie();
            const totalBogiePeople = bogies * perBogie;
            totalLenOut.textContent = `${totalM.toFixed(1)} m (${bogies} bogie${bogies === 1 ? "" : "s"})`;
            peopleOut.textContent = bogies === 0 ? "0 (no bogies)" : `${totalBogiePeople} (${perBogie} / bogie)`;
            calcTimeOut.textContent = Number.isFinite(tSec) ? `${tSec.toFixed(2)} s` : "Enter speed > 0";
            renderTrainSvg();
            positionTrainByProgress(0);
        }

        function clearThrownItems() {
            thrownItems = [];
            thrownItemsGroup.innerHTML = "";
            nextThrowTimeSec = THROW_DELAY_SEC;
        }

        function stopAnimation() {
            running = false;
            startTimestamp = null;
            if (animId) cancelAnimationFrame(animId);
            animId = null;
            animateWindowHeads(0, false);
            stopTrainSound();
        }

        function resetSimulation() {
            stopAnimation();
            hornPlayedAtPole = false;
            clearThrownItems();
            liveTimeOut.textContent = "0.00 s";
            updateReadouts();
        }

        function startGo() {
            const vMps = getSpeedMps();
            const tSec = getCrossingTimeSec();
            if (!Number.isFinite(tSec) || tSec <= 0) {
                calcTimeOut.textContent = "Please enter a valid speed > 0";
                return;
            }

            stopAnimation();
            running = true;
            hornPlayedAtPole = false;
            clearThrownItems();
            startTimestamp = null;
            let lastFrameTime = null;
            liveTimeOut.textContent = "0.00 s";
            positionTrainByProgress(0);
            updateStopSignalState(0, true, false);
            startTrainSound(vMps);

            const visualDurationSec = Math.max(0.6, tSec);

            function frame(now) {
                if (!running) return;
                if (!startTimestamp) {
                    startTimestamp = now;
                    lastFrameTime = now;
                }
                const dtStep = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
                lastFrameTime = now;

                const dtReal = (now - startTimestamp) / 1000;
                const visualProgress = Math.min(1, dtReal / visualDurationSec);
                const simulatedClockSec = visualProgress * tSec;

                liveTimeOut.textContent = `${simulatedClockSec.toFixed(2)} s`;
                positionTrainByProgress(visualProgress);
                animateWindowHeads(dtReal, visualProgress < 1);
                updateStopSignalState(dtReal, visualProgress < 1, false);
                spawnThrownItems(dtReal);
                updateAndRenderThrownItems(dtStep);

                if (visualProgress < 1 || thrownItems.length > 0) {
                    if (visualProgress >= 1 && running) {
                        running = false;
                        stopTrainSound();
                        animateWindowHeads(0, false);
                        updateStopSignalState(0, false, true);
                        liveTimeOut.textContent = `${tSec.toFixed(2)} s (Done)`;
                    }
                    animId = requestAnimationFrame(frame);
                } else {
                    animId = null;
                }
            }

            animId = requestAnimationFrame(frame);
        }

        muteBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            muteBtn.textContent = soundEnabled ? "Sound: ON" : "Sound: OFF";
            if (!soundEnabled) {
                stopTrainSound();
            } else if (running) {
                startTrainSound(getSpeedMps());
            }
        });

        document.getElementById("incBogie").addEventListener("click", () => {
            bogies = Math.min(20, bogies + 1);
            resetSimulation();
        });

        document.getElementById("decBogie").addEventListener("click", () => {
            bogies = Math.max(0, bogies - 1);
            resetSimulation();
        });

        [speedInput, speedUnitSelect, bogieLenInput, engineLenInput].forEach((el) => {
            el.addEventListener("input", resetSimulation);
            el.addEventListener("change", resetSimulation);
        });

        goBtn.addEventListener("click", startGo);
        resetBtn.addEventListener("click", resetSimulation);

        updateReadouts();
    </script>
</body>

</html>
