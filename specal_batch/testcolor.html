   <style>
         *{box-sizing: border-box;padding: 0%;margin: 0%;}
         input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>

<body>
 


<div class="color_eq_container open_colse"> 
    <input type="color" id="colorPicker" value="#38bdf8">
    <p id="hexOutput"></p>
    </div>
    <script>
        const picker = document.getElementById("colorPicker");
        const output = document.getElementById("hexOutput");

        // Read current value on load
        output.textContent = picker.value;

        // Update live as the user drags in the color picker
        picker.addEventListener("input", () => {
            output.textContent = picker.value;
            document.body.style.backgroundColor = picker.value;
        });
