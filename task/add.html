<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add(+)</title>
    <style>
      

      * {
        box-sizing: border-box;
        padding: 0%;
        margin: 0%;
        font-size: 16px;
      }

      body {
        background-color: rgb(250, 249, 247);
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .heading_addition {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        background-color: beige;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;;
        font-size: 2rem;
      }
      .r_c_hm {
        border: 0px solid red;
        display: flex;
        flex-wrap: wrap;
      }
      .row,
      .col,
      .how_many {
        padding: 1rem;
        width: 45vw;
        display: inline-block;
        font-size: 2rem;
        font-weight: 500;
        border: 0px solid gray;
        margin-right: 0rem;
        border-right: 1px solid gray;
        border-bottom: 1px solid gray;
      }
      .how_many {
        border-bottom: 0 solid;
        border-right: 0 solid;
      }

      .add_container {
        border: 0px solid pink;
        background-color: rgb(215, 216, 218);
        display: flex;
         
        flex-wrap: wrap;
        padding-bottom: 10vh;
      }
      .mini_container {
        margin: 1rem;
        border: 0px solid green;
        display: inline-block;
        padding: 0 0.5rem 1.5rem 1.5rem;
        border-radius: 0.3pc;
        background-color: whitesmoke;
      }

      .col_num {
        letter-spacing: 1rem;
        font-size: 1.5rem;
        font-family: "Times New Roman", Times, serif;
      }
      .sln {
        border: 0px solid red;
        border-radius: 8.5pc;
        display: inline-block;
        color: gray;
        transform: translateX(-0.3rem);
      }

      button {
        min-width: 25vw;
        border: 1px solid gray;
      }

      .btn_eq {
      }
      .btn_eq {
        font-size: 2.5rem;
        border: 1px solid gray;
        width: 45vw;
        border-top: 0px solid gray;
        border-bottom: 0 solid;
      }
      .refresh {
        width: 95vw;
        height: 2rem;
        margin-top: 1rem;
      }
      .col_num_last::before {
      }
      .col_num {
        transform: translateX(1rem);
      }

      .add {
        transform: translateX(-0.9rem);
      }
      .add::before {
        content: "+";
        font-size: 1.5rem;
        font-weight: 300;
        font-family: Arial, Helvetica, sans-serif;
      }
      .input_sum {
        width: 80vw;
        height: 2rem;
        color: red;
      }
      .input_sum {
        min-width: 1vw;
        height: 2.5rem;
        color: blue;
        border: 1px solid rgb(88, 87, 87);
        border-top: none;
        padding-left: 1rem;
        letter-spacing: 1rem;
        font-size: 1.3rem;
        text-align: left;

      }

 
    </style>
  </head>
  <body>
    <h1 class="heading_addition">Addition ( + )</h1>

    <div class="r_c_hm">
      <input
        type="number"
        name=""
        id=""
        class="row"
        autofocus
        placeholder="row"
      />
      <input
        type="number"
        name=""
        id=""
        class="col"
        autofocus
        placeholder="col"
      />
      <input
        type="number"
        name=""
        id=""
        class="how_many"
        value=""
        autofocus
        placeholder="how-many"
      />

      <button class="btn_eq">=</button>
      <button class="refresh">Refresh</button>
    </div>
    <hr />

    <div class="add_container"></div>
    <script>
     
  const row = document.querySelector(".row");
  const col = document.querySelector(".col");
  const btn_eq = document.querySelector(".btn_eq");
  const how_many = document.querySelector(".how_many");
  const add_container = document.querySelector(".add_container");
  const refresh = document.querySelector(".refresh");

  refresh.addEventListener("click", () => {
    add_container.innerHTML = "";
    how_many.value = "";
    row.value = "";
    col.value = "";
  });

  btn_eq.addEventListener("click", () => {
    // Optional: Clear previous questions before generating new ones
    add_container.innerHTML = "";

    const digits = +row.value;
    const numCount = +col.value;
    const questionCount = +how_many.value;

    for (let howMany = 1; howMany <= questionCount; howMany++) {
      // 1. Reset totalsum for each new question
      let totalsum = 0;

      const mini_container = document.createElement("div");
      mini_container.classList.add("mini_container");
      add_container.appendChild(mini_container);

      const sln = document.createElement("span");
      sln.classList.add("sln");
      sln.innerText = `Q${howMany} Add the following numbers.`;
      mini_container.prepend(sln);

      for (let howManyCol = 1; howManyCol <= numCount; howManyCol++) {
        const col_num = document.createElement("div");
        col_num.classList.add("col_num");

        // Generate random number and pad with trailing zeros to match digit length
        const randomNum = Math.floor(Math.random() * 10 ** digits);
        const formattedNum = randomNum.toString().padEnd(digits, "0");

        col_num.innerText = formattedNum;
        mini_container.appendChild(col_num);

        // 2. Add the generated number once to totalsum
        totalsum += +formattedNum;

        // Add the '+' sign and answer box on the last number
        if (howManyCol === numCount) {
          col_num.classList.add("col_num_last", "add");

          const hr = document.createElement("hr");
          mini_container.append(hr);

          const input_sum = document.createElement("input");
          input_sum.classList.add("input_sum");
          input_sum.setAttribute("type", "number");
          input_sum.setAttribute("placeholder", "?...");
          input_sum.autofocus=true;
          
          // 3. Assign the calculated sum directly to this card's input
          // (Remove the line below if you want the user to type the answer themselves)
       input_sum.addEventListener("keyup", () => {
        if (+input_sum.value === 1.11) {
           input_sum.value = totalsum;
           input_sum.style.border = "2px solid green";
         }
            if (+input_sum.value === totalsum) {
              input_sum.style.border = "2px solid green";
              input_sum.style.backgroundColor = "#90EE90";
              //#e6f4ea"; // Optional: subtle success background
            } else {
              input_sum.style.border = "1px solid rgb(88, 87, 87)"; // Reset border
              input_sum.style.backgroundColor = ""; // Reset background
            }
          });
          
          

          mini_container.append(input_sum);
        }
      }
    }
  });
 
    </script>
  </body>
</html>
