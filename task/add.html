    *{box-sizing: border-box;padding: 0%;margin: 0%;font-size:16px}

    <div class="add_container">

    <script>
           function getRandomRgbColor() {
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                const a = Math.random() ;
                return `rgba(${r}, ${g}, ${b},${a})`;
              };
    const r_c_hm=document.querySelector(".r_c_hm");
    const row = document.querySelector(".row");
     const col = document.querySelector(".col");
     const btn_eq=document.querySelector(".btn_eq");
     const how_many = document.querySelector(".how_many");
     const add_container=document.querySelector(".add_container");
     const refresh=document.querySelector(".refresh");
       
     refresh.addEventListener("click",()=>{ add_container.innerHTML=""; how_many.value="";row.value="";col.value="";})
     btn_eq.addEventListener("click",()=>{
        
     for(let howMany =1; howMany<= +how_many.value;howMany++){const mini_container=document.createElement("div");

          {  const sln=document.createElement("span");

                 col_num.classList.add("col_num_last");  
    const col_num_last=document.querySelectorAll(".col_num_last");
 col_num_last.forEach((el,index)=>{el.classList.add("add")})
