<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplication Table Practice</title>
    <script src="/netlifyiconjs/netlifyicon.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
        padding: 0%;
        margin: 0%;
        font-size: 16px;
      }

      body {
        background-color: rgb(250, 249, 247);
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .heading_table {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        background-color: beige;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-size: 2rem;
      }

      .r_c_hm {
        display: flex;
        flex-wrap: wrap;
      }

      .table_num,
      .up_to {
        padding: 1rem;
        width: 45vw;
        display: inline-block;
        font-size: 2rem;
        font-weight: 500;
        border: 0px solid gray;
        margin-right: 0rem;
        border-right: 1px solid gray;
        border-bottom: 1px solid gray;
      }

      .table_container {
        background-color: rgb(215, 216, 218);
        display: flex;
        flex-wrap: wrap;
        padding-bottom: 10vh;
      }

      .mini_container {
        margin: 1rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.8rem 1.2rem;
        border-radius: 0.3pc;
        background-color: whitesmoke;
        min-width: 240px;
      }

      .equation_text {
        font-size: 1.5rem;
        font-family: "Times New Roman", Times, serif;
        font-weight: bold;
        white-space: nowrap;
      }

      button {
        min-width: 25vw;
        border: 1px solid gray;
      }

      .btn_eq {
        font-size: 2.5rem;
        border: 1px solid gray;
        width: 45vw;
        border-top: 0px solid gray;
        cursor: pointer;
      }

      .refresh {
        width: 45vw;
        font-size: 1.5rem;
        border-top: 0px solid gray;
        border-left: 0px solid gray;
        cursor: pointer;
      }

      .input_ans {
        width: 100px;
        height: 2.5rem;
        color: blue;
        border: 1px solid rgb(88, 87, 87);
        padding-left: 0.6rem;
        letter-spacing: 0.1rem;
        font-size: 1.3rem;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <h1 class="heading_table">Multiplication Table ( × )</h1>

    <div class="r_c_hm">
      <input
        type="number"
        class="table_num"
        autofocus
        placeholder="which table (e.g. 7)"value="7" />
      <input type="number" class="up_to" placeholder="up to (e.g. 10)"value="10" />

      <button class="btn_eq">=</button>
      <button class="refresh">Refresh</button>
    </div>
    <hr />

    <div class="table_container"></div>

    <script>
      const tableNumInput = document.querySelector(".table_num");
      const upToInput = document.querySelector(".up_to");
      const btn_eq = document.querySelector(".btn_eq");
      const table_container = document.querySelector(".table_container");
      const refresh = document.querySelector(".refresh");

      refresh.addEventListener("click", () => {
        table_container.innerHTML = "";
        tableNumInput.value = "";
        upToInput.value = "10";
      });

      btn_eq.addEventListener("click", () => {
        table_container.innerHTML = "";

        const baseNum = +tableNumInput.value;
        const limit = +upToInput.value || 10; // Defaults to 10 if left blank

        if (baseNum <= 0 || limit <= 0) return;

        for (let i = 1; i <= limit; i++) {
          const correctProduct = baseNum * i;

          const mini_container = document.createElement("div");
          mini_container.classList.add("mini_container");
          table_container.appendChild(mini_container);

          const equation_text = document.createElement("span");
          equation_text.classList.add("equation_text");
          equation_text.innerText = `${baseNum} × ${i} =`;
          mini_container.appendChild(equation_text);

          const input_ans = document.createElement("input");
          input_ans.classList.add("input_ans");
          input_ans.setAttribute("type", "number");
          input_ans.setAttribute("placeholder", "?");
          if (i === 1) input_ans.autofocus = true;

          // Live validation + 1.11 cheat code
          input_ans.addEventListener("keyup", () => {
            if (+input_ans.value === 1.11) {
              input_ans.value = correctProduct;
            }

            if (+input_ans.value === correctProduct) {
              input_ans.style.border = "2px solid green";
              input_ans.style.backgroundColor = "#90EE90";
            } else {
              input_ans.style.border = "1px solid rgb(88, 87, 87)";
              input_ans.style.backgroundColor = "";
            }
          });

          mini_container.appendChild(input_ans);
        }
      });
    </script>
  </body>
</html>
