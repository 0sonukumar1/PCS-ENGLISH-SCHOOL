<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pahada (पहाड़ा) Practice</title>
    <script src="/netlifyiconjs/netlifyicon.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0%;
            margin: 0%;
            font-size: 16px;
        }

        body {
            background-color: rgb(250, 249, 247);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .heading_pahada {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-color: beige;
            font-family: cursive;
            font-size: 2rem;
        }

        .r_c_hm {
            display: flex;
            flex-wrap: wrap;
        }

        .max_table,
        .max_mult,
        .how_many {
            padding: 1rem;
            width: 45vw;
            display: inline-block;
            font-size: 2rem;
            font-weight: 500;
            border: 0px solid gray;
            margin-right: 0rem;
            border-right: 1px solid gray;
            border-bottom: 1px solid gray;
        }

        .how_many {
            border-bottom: 0 solid;
            border-right: 0 solid;
        }

        .pahada_container {
            background-color: rgb(215, 216, 218);
            display: flex;
            flex-wrap: wrap;
            padding-bottom: 10vh;
        }

        .mini_container {
            margin: 1rem;
            display: inline-block;
            padding: 0.8rem 1.2rem 1.2rem 1.2rem;
            border-radius: 0.3pc;
            background-color: whitesmoke;
            min-width: 240px;
        }

        .sln {
            display: block;
            color: gray;
            margin-bottom: 0.5rem;
        }

        .equation_row {
            font-size: 1.6rem;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            letter-spacing: 0.1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .input_ans {
            width: 110px;
            height: 2.4rem;
            color: blue;
            border: 1px solid rgb(88, 87, 87);
            padding-left: 0.6rem;
            letter-spacing: 0.15rem;
            font-size: 1.3rem;
            text-align: left;
        }

        button {
            min-width: 25vw;
            border: 1px solid gray;
        }

        .btn_eq {
            font-size: 2.5rem;
            border: 1px solid gray;
            width: 45vw;
            border-top: 0px solid gray;
            border-bottom: 0 solid;
            cursor: pointer;
        }

        .refresh {
            width: 95vw;
            height: 2rem;
            margin-top: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 class="heading_pahada">Pahada / पहाड़ा ( × )</h1>

    <div class="r_c_hm">
        <input type="number" class="max_table" autofocus placeholder="pahada up to (e.g. 20)" />
        <input type="number" class="max_mult" placeholder="up to × (e.g. 10)" />
        <input type="number" class="how_many" placeholder="how-many questions" />

        <button class="btn_eq">=</button>
        <button class="refresh">Refresh</button>
    </div>
    <hr />

    <div class="pahada_container"></div>

    <script>
        const maxTableInput = document.querySelector(".max_table");
        const maxMultInput = document.querySelector(".max_mult");
        const howManyInput = document.querySelector(".how_many");
        const btn_eq = document.querySelector(".btn_eq");
        const pahada_container = document.querySelector(".pahada_container");
        const refresh = document.querySelector(".refresh");

        refresh.addEventListener("click", () => {
            pahada_container.innerHTML = "";
            maxTableInput.value = "";
            maxMultInput.value = "";
            howManyInput.value = "";
        });

        btn_eq.addEventListener("click", () => {
            pahada_container.innerHTML = "";

            const maxTable = +maxTableInput.value;
            const maxMult = +maxMultInput.value || 10; // Defaults to 10 if left blank
            const questionCount = +howManyInput.value || 10;

            if (maxTable <= 0 || maxMult <= 0 || questionCount <= 0) return;

            for (let q = 1; q <= questionCount; q++) {
                // Pick a random table from 2 to maxTable (or 1 if maxTable is 1)
                const minTable = maxTable === 1 ? 1 : 2;
                const tableNum = Math.floor(Math.random() * (maxTable - minTable + 1)) + minTable;
                const multiplier = Math.floor(Math.random() * maxMult) + 1;
                const correctAnswer = tableNum * multiplier;

                const mini_container = document.createElement("div");
                mini_container.classList.add("mini_container");
                pahada_container.appendChild(mini_container);

                const sln = document.createElement("span");
                sln.classList.add("sln");
                sln.innerText = `Q${q}.`;
                mini_container.appendChild(sln);

                const equation_row = document.createElement("div");
                equation_row.classList.add("equation_row");
                equation_row.innerText = `${tableNum} × ${multiplier} =`;

                const input_ans = document.createElement("input");
                input_ans.classList.add("input_ans");
                input_ans.setAttribute("type", "number");
                input_ans.setAttribute("placeholder", "?");
                if (q === 1) input_ans.autofocus = true;

                // Live validation + 1.11 cheat code
                input_ans.addEventListener("keyup", () => {
                    if (+input_ans.value === 1.11) {
                        input_ans.value = correctAnswer;
                    }

                    if (input_ans.value !== "" && +input_ans.value === correctAnswer) {
                        input_ans.style.border = "2px solid green";
                        input_ans.style.backgroundColor = "#90EE90";
                    } else {
                        input_ans.style.border = "1px solid rgb(88, 87, 87)";
                        input_ans.style.backgroundColor = "";
                    }
                });

                equation_row.appendChild(input_ans);
                mini_container.appendChild(equation_row);
            }
        });
    </script>
</body>

</html>
