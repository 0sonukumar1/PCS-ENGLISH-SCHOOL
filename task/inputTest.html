<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="/netlifyiconjs/netlifyicon.js" defer></script>
  <style>
    .div_ra {
      width: 80px;
      height: 10px;
      background-color: rgb(235, 188, 188);
    }
    .input_rb {
      height: auto;
    }
  </style>
</head>
<body>
  <div class="div_ra"></div>
  <input type="number" id="rtlTypingInput"
    style="direction: ltr; text-align: right; font-size: 22px; padding: 10px; width: 100%; box-sizing: border-box;"
    placeholder="0" class="input_rb" />
  
  <script>
    
    const input = document.getElementById('rtlTypingInput');

    input.addEventListener('beforeinput', function (e) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const val = input.value;

      // 1. जब नया अक्षर या नंबर टाइप किया जाए (राइट-टू-लेफ्ट कर्सर मूवमेंट)
      if (e.inputType === 'insertText' && e.data) {
        e.preventDefault();
        const newVal = val.slice(0, start) + e.data + val.slice(end);
        input.value = newVal;
        input.setSelectionRange(start, start);
      }

      // 2. जब मोबाइल कीबोर्ड का क्रॉस (Backspace) बटन दबाया जाए
      else if (e.inputType === 'deleteContentBackward') {
        e.preventDefault();
        if (start !== end) {
          // यदि कुछ टेक्स्ट सेलेक्ट है, तो उसे हटाएं
          const newVal = val.slice(0, start) + val.slice(end);
          input.value = newVal;
          input.setSelectionRange(start, start);
        } else if (start > 0) {
          // ठीक पीछे वाले एक डिजिट/अक्षर को हटाएं
          const newVal = val.slice(0, start - 1) + val.slice(end);
          input.value = newVal;
          input.setSelectionRange(start - 1, start - 1);
        }
      }

      // 3. जब Delete बटन दबाया जाए
      else if (e.inputType === 'deleteContentForward') {
        e.preventDefault();
        if (start !== end) {
          const newVal = val.slice(0, start) + val.slice(end);
          input.value = newVal;
          input.setSelectionRange(start, start);
        } else if (start < val.length) {
          const newVal = val.slice(0, start) + val.slice(start + 1);
          input.value = newVal;
          input.setSelectionRange(start, start);
        }
      }
    });

    // 4. मोबाइल और डेस्कटॉप के 'Cut' बटन के लिए
    input.addEventListener('cut', function (e) {
      e.preventDefault();
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const val = input.value;

      if (start !== end) {
        const selectedText = val.slice(start, end);
        if (e.clipboardData) {
          e.clipboardData.setData('text/plain', selectedText);
        }
        const newVal = val.slice(0, start) + val.slice(end);
        input.value = newVal;
        input.setSelectionRange(start, start);
      }
    });
 
   
    const div_ra = document.querySelector(".div_ra");
    const input_rb = document.querySelector(".input_rb");

    if (div_ra && input_rb) {
      // Get computed height as a string with unit (e.g., "60px")
      
      const divWidth = window.getComputedStyle(div_ra).width;
      input_rb.style.width = divWidth; // Set the input width to match the div width
      console.log(divWidth,  "_width",input_rb.style.width);
    }
</script>
</body>
</html>
