input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        @keyframes spinzr {
            from {
                transform: rotateZ(0deg);
            }

            to {
                transform: rotateZ(calc(360deg));
            }
        }

        @keyframes spinzw {
            from {
                transform: rotateZ(0deg);
            }

            to {
                transform: rotateZ(calc(360deg));
            }
        }

        @keyframes spinz {

            from {
                5transform: rotateZ(0deg);
            }

            to {
                rotate: 1turn;
                6transform: rotateZ(3600000deg);
            }
        }
    </style>
</head>
