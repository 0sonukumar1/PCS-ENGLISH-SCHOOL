<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-circle { fill: #ffffff; stroke: #000000; stroke-width: 8; }
      .inner-ring { fill: none; stroke: #000000; stroke-width: 3; }
      .text-pcs { font-family: 'Times New Roman', Times, serif; font-size: 150px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .icon-element { fill: #000000; }
    </style>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="250" cy="250" r="230" class="bg-circle" />

  <!-- Inner Decorative Rings -->
  <circle cx="250" cy="250" r="210" class="inner-ring" />
  <circle cx="250" cy="250" r="200" class="inner-ring" stroke-dasharray="4,4" />

  <!-- Top Star and Quill Icon Elements -->
  <g class="icon-element" transform="translate(250, 95)">
    <!-- Star -->
    <path d="M0,-25 L6,-8 L23,-8 L9,2 L14,19 L0,9 L-14,19 L-9,2 L-23,-8 L-6,-8 Z" transform="scale(0.7) translate(0, -10)" />
    <!-- Quill / Feather -->
    <path d="M-5,10 C15,0 35,-25 45,-35 C40,-25 30,-5 5,20 Z" />
    <path d="M20,-15 C25,-12 30,-8 35,-5" stroke="#ffffff" stroke-width="2" fill="none" />
  </g>

  <!-- Center Text: PCS -->
  <text x="250" y="260" class="text-pcs">PCS</text>

  <!-- Bottom Laurel Leaves and Torch Elements -->
  <g class="icon-element" transform="translate(250, 395)">
    <!-- Torch Center -->
    <path d="M-4,15 L4,15 L2,-10 L-2,-10 Z" />
    <path d="M0,-12 C-6,-18 4,-28 0,-35 C5,-28 8,-18 0,-12 Z" />
    
    <!-- Left Laurel Branch -->
    <path d="M-15,5 C-40,5 -60,-15 -80,-30 C-70,-15 -50,15 -15,25 Z" />
    <path d="M-30,-2 C-35,-8 -45,-10 -52,-12 C-45,-2 -40,5 -30,-2 Z" />
    <path d="M-45,3 C-50,-3 -60,-5 -67,-7 C-60,3 -55,10 -45,3 Z" />
    <path d="M-18,13 C-25,8 -35,8 -42,5 C-35,13 -28,18 -18,13 Z" />

    <!-- Right Laurel Branch -->
    <path d="M15,5 C40,5 60,-15 80,-30 C70,-15 50,15 15,25 Z" />
    <path d="M30,-2 C35,-8 45,-10 52,-12 C45,-2 40,5 30,-2 Z" />
    <path d="M45,3 C50,-3 60,-5 67,-7 C60,3 55,10 45,3 Z" />
    <path d="M18,13 C25,8 35,8 42,5 C35,13 28,18 18,13 Z" />
  </g>
</svg>